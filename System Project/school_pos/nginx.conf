upstream school_pos {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# HTTP: redirect everything to HTTPS.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen 0.0.0.0:80;
    server_name gw.darkzhub.asia sms2-api.darkzhub.asia sms.darkzhub.asia;

    # The previous `server_name _;` accepted ANY Host header, which fed
    # Host-header injection into generated absolute URLs. Named hosts only.
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen 0.0.0.0:443 ssl;
    http2 on;
    server_name gw.darkzhub.asia sms2-api.darkzhub.asia sms.darkzhub.asia;

    ssl_certificate     /etc/letsencrypt/live/darkzhub.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/darkzhub.asia/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;

    # Security headers (always-scoped so they apply to errors too).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    client_max_body_size 10M;
    client_body_timeout 60s;
    proxy_read_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    access_log off;
    location = /health/ {
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://school_pos;
        # $host (not $http_host) so a forged Host header cannot be forwarded.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_buffering off;
    }

    # Static assets are not PII, so they stay cacheable.
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Media DOES contain student PII (photos, uploaded documents).
    # Proxying to Django keeps the auth/header handling in one place instead of
    # serving the directory anonymously from disk. Never mark this public.
    location /media/ {
        proxy_pass http://school_pos;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:" always;
    }
}
