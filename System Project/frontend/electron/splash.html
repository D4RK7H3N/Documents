<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>School Management System</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      -webkit-app-region: no-drag;
      background: #0f2044;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif;
      position: relative;
      /* Layered depth: warm gold bloom over the navy, plus a fine grid. */
      background:
        radial-gradient(120% 90% at 50% 0%, rgba(201,168,76,0.10) 0%, rgba(15,32,68,0) 62%),
        radial-gradient(90% 70% at 50% 110%, rgba(28,74,120,0.35) 0%, rgba(15,32,68,0) 60%),
        linear-gradient(168deg, #14294d 0%, #0f2044 46%, #0a1729 100%);
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.022) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: radial-gradient(80% 70% at 50% 45%, #000 0%, transparent 100%);
      -webkit-mask-image: radial-gradient(80% 70% at 50% 45%, #000 0%, transparent 100%);
      pointer-events: none;
    }

    /* Gold hairline frame, like a certificate border */
    body::after {
      content: '';
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(201,168,76,0.16);
      border-radius: 6px;
      pointer-events: none;
    }

    .splash-container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 0 40px;
      text-align: center;
      animation: riseIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }

    /* ---- brand mark ---- */
    .brand-mark {
      width: 104px;
      height: 104px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Soft halo behind the mark */
    .brand-mark::before {
      content: '';
      position: absolute;
      width: 132px;
      height: 132px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201,168,76,0.16) 0%, rgba(201,168,76,0) 68%);
      animation: breathe 4.5s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.75; }
      50%      { transform: scale(1.07); opacity: 1; }
    }

    /* Real school logo when one is cached; the seal is the fallback. */
    .brand-logo {
      max-width: 104px;
      max-height: 104px;
      object-fit: contain;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 3px 10px rgba(0,0,0,0.4));
    }

    .brand-seal {
      width: 104px;
      height: 104px;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 0 14px rgba(201,168,76,0.28));
      animation: sealIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes sealIn {
      from { opacity: 0; transform: scale(0.88) rotate(-8deg); }
      to   { opacity: 1; transform: none; }
    }

    /* ---- text ---- */
    .school-name {
      color: #ffffff;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.2px;
      line-height: 1.25;
      margin-bottom: 6px;
      /* Long school names wrap rather than clip in a 520px window. */
      max-height: 48px;
      overflow: hidden;
    }

    .school-name .product {
      display: block;
      font-size: 9.5px;
      font-weight: 500;
      color: #c9a84c;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      margin-top: 7px;
    }

    /* ---- progress ---- */
    .progress-section {
      width: 100%;
      margin-top: 26px;
    }

    .progress-track {
      width: 100%;
      max-width: 300px;
      height: 3px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.09);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 6%;
      border-radius: 9999px;
      background: linear-gradient(90deg, #b8912f 0%, #e8ce85 50%, #f5e3b0 75%, #c9a84c 100%);
      box-shadow: 0 0 10px rgba(201,168,76,0.45);
      /* Stage-driven, so the width never sits still or overstates progress. */
      transition: width 0.75s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .progress-meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      max-width: 300px;
      margin: 11px auto 0;
    }

    /* Real stage names from the main process. Never invents a step. */
    .status-text {
      color: rgba(255, 255, 255, 0.62);
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.3px;
      text-align: left;
      transition: opacity 0.25s ease;
      min-height: 14px;
    }

    .status-pct {
      color: rgba(201,168,76,0.8);
      font-size: 10px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.4px;
      flex-shrink: 0;
    }

    .status-text.swapping { opacity: 0; }

    /* ---- footer ---- */
    .footer {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 26px;
      color: rgba(255, 255, 255, 0.24);
      font-size: 9px;
      letter-spacing: 0.2px;
    }

    .footer-center {
      color: rgba(201,168,76,0.62);
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="splash-container">

    <!-- Brand mark: real school logo when cached, official seal otherwise. -->
    <div class="brand-mark">
      <img id="brandLogo" class="brand-logo" alt="" style="display:none" />
      <svg id="brandSeal" class="brand-seal" viewBox="0 0 110 110" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#c9a84c;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#f0d080;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#c9a84c;stop-opacity:1" />
          </linearGradient>
        </defs>

        <circle cx="55" cy="55" r="53" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
        <circle cx="55" cy="55" r="50" fill="none" stroke="url(#goldGrad)" stroke-width="0.8"/>
        <circle cx="55" cy="55" r="49" fill="#0f2044" />

        <!-- Curved text is the product name only; the school name sits below
             as real text so it can use the configured value. -->
        <path id="topCurve" d="M 12,55 A 43,43 0 0,1 98,55" fill="none"/>
        <text font-family="Segoe UI, Arial, sans-serif" font-size="6.6" font-weight="700" fill="#c9a84c" letter-spacing="1.1">
          <textPath href="#topCurve" startOffset="50%" text-anchor="middle">
            SCHOOL MANAGEMENT SYSTEM
          </textPath>
        </text>

        <path id="bottomCurve" d="M 16,55 A 39,39 0 0,0 94,55" fill="none"/>
        <text font-family="Segoe UI, Arial, sans-serif" font-size="5.4" font-weight="400" fill="#c9a84c" letter-spacing="0.5">
          <textPath href="#bottomCurve" startOffset="50%" text-anchor="middle">
            EST. 2026
          </textPath>
        </text>

        <circle cx="55" cy="55" r="37" fill="none" stroke="#c9a84c" stroke-width="0.5" opacity="0.3"/>

        <!-- Graduation cap -->
        <g transform="translate(55, 58)" opacity="0.95">
          <polygon points="0,-18 -22,-6 -22,0 0,12 22,0 22,-6" fill="#c9a84c"/>
          <polygon points="0,-18 -20,-6 0,-2 20,-6" fill="#f0d080"/>
          <path d="M-18,-2 L-18,2 Q-18,6 -10,6 L-10,4 Q-10,2 -14,1 L-14,2 L-18,2" fill="#c9a84c"/>
          <circle cx="0" cy="-18" r="2.5" fill="#f0d080"/>
          <line x1="20" y1="-6" x2="26" y2="2" stroke="#c9a84c" stroke-width="1.5"/>
          <circle cx="26" cy="5" r="2" fill="#c9a84c"/>
          <circle cx="26" cy="5" r="1" fill="#f0d080"/>
        </g>

        <g fill="#c9a84c" opacity="0.7">
          <polygon points="8,55 10,52 12,55 10,58"/>
          <polygon points="98,55 100,52 102,55 100,58"/>
        </g>

        <circle cx="55" cy="55" r="47" fill="none" stroke="#c9a84c" stroke-width="0.3" opacity="0.2"/>
      </svg>
    </div>

    <p class="school-name" id="schoolName">
      School Management System
      <span class="product" id="productLabel">Integrated Academic &amp; Financial Platform</span>
    </p>

    <div class="progress-section">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-meta">
        <span class="status-text" id="statusText">Starting up</span>
        <span class="status-pct" id="statusPct">6%</span>
      </div>
    </div>

  </div>

  <div class="footer">
    <span id="footerVersion">v—</span>
    <span class="footer-center">Developed by DarkZhen</span>
    <span>&copy; 2026 SMS</span>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(location.search);

      const schoolEl   = document.getElementById('schoolName');
      const logoEl     = document.getElementById('brandLogo');
      const sealEl     = document.getElementById('brandSeal');
      const fillEl     = document.getElementById('progressFill');
      const statusEl   = document.getElementById('statusText');
      const pctEl      = document.getElementById('statusPct');
      const versionEl  = document.getElementById('footerVersion');

      // Version is injected from app.getVersion(); never hardcoded, so it
      // cannot drift out of step with package.json again.
      versionEl.textContent = 'v' + (params.get('v') || '—');

      // Real school branding, cached by the renderer on its last successful
      // config load. Falls back to the generic name and seal when absent.
      const school = (params.get('school') || '').trim();
      if (school) {
        schoolEl.firstChild.nodeValue = school;
      }

      const logo = (params.get('logo') || '').trim();
      if (logo) {
        logoEl.src = logo;
        logoEl.style.display = 'block';
        sealEl.style.display = 'none';
        // A logo URL that has gone stale must not leave a blank frame.
        logoEl.addEventListener('error', () => {
          logoEl.style.display = 'none';
          sealEl.style.display = '';
        });
      }

      let current = 6;

      // Called by the Electron main process as real load events arrive.
      window.__splash = {
        stage: function (name, pct, label) {
          current = pct;
          fillEl.style.width = pct + '%';
          pctEl.textContent = pct + '%';
          if (label) {
            statusEl.classList.add('swapping');
            // Let the fade-out land before swapping the words.
            setTimeout(function () {
              statusEl.textContent = label;
              statusEl.classList.remove('swapping');
            }, 160);
          }
        },
        pct: function () { return current; },
      };
    })();
  </script>
</body>
</html>
