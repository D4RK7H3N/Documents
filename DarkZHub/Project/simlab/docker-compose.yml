# SimLab docker-compose: full local stack.
#
#   docker compose up                 -> db + redis + backend (API on :8003) + worker
#   docker compose --profile full up  -> also builds/starts the frontend (Phase 3+)
#
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: simlab
      POSTGRES_USER: simlab
      POSTGRES_PASSWORD: simlab
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simlab -d simlab"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8003"
    environment:
      SECRET_KEY: dev-only-insecure-key-change-me
      DEBUG: "1"
      POSTGRES_DB: simlab
      POSTGRES_USER: simlab
      POSTGRES_PASSWORD: simlab
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8003:8003"
    volumes:
      - ./backend:/app  # live code reload in dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A simlab worker -l info
    environment:
      SECRET_KEY: dev-only-insecure-key-change-me
      DEBUG: "1"
      POSTGRES_DB: simlab
      POSTGRES_USER: simlab
      POSTGRES_PASSWORD: simlab
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Frontend service: enabled with --profile full once the Vite app
  # exists (Phase 3). Kept here so the stack definition is complete.
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8003
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    profiles: ["full"]
    depends_on:
      - backend

volumes:
  pgdata:
